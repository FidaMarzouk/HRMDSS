<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/src/assets/enova_logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HRMS | Enova Robotics</title>
  <meta name="description" content="Human Resource Management System for Enova Robotics" />
  <!-- Preload fonts if you're using custom fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Optional: Add theme color for mobile browsers -->
  <meta name="theme-color" content="#3baca5" />
  <style>
    /* Add a simple loading style */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: #121212;
      color: white;
    }
    #root {
      min-height: 100vh;
      display: flex;
    }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background-color: #121212;
    }
    .loading img {
      max-width: 200px;
      margin-bottom: 20px;
    }
    .loading-text {
      color: #3baca5;
      font-size: 18px;
      margin-top: 20px;
    }
    .loading-spinner {
      border: 4px solid rgba(59, 172, 165, 0.1);
      border-radius: 50%;
      border-top: 4px solid #3baca5;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root">
    <!-- Loading screen that shows before React loads -->
    <div class="loading">
      <img src="/src/assets/logo.png" alt="Enova Robotics" />
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading HRMS System...</div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
