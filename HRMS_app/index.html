<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/src/assets/enova_logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ENOVA Pulse · HR</title>
  <meta name="description" content="HR management and decision support for Enova Robotics" />
  <meta name="theme-color" content="#EEF2F1" />
  <script>
    // Apply the saved theme before first paint (see src/theme/ThemeProvider.jsx).
    try {
      var mode = localStorage.getItem("pulse-theme");
      if (mode === "shift") mode = localStorage.getItem("pulse-theme-shift");
      if (mode === "light" || mode === "dark") document.documentElement.setAttribute("data-theme", mode);
    } catch (e) {}
  </script>
  <style>
    /* Loading screen shown until React mounts; colours mirror src/styles/tokens.css. */
    :root { --boot-bg: #EEF2F1; --boot-ink: #566765; --boot-teal: #0B736A; }
    :root[data-theme="dark"] { --boot-bg: #0D1112; --boot-ink: #87968F; --boot-teal: #35C2B3; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) { --boot-bg: #0D1112; --boot-ink: #87968F; --boot-teal: #35C2B3; }
    }
    html, body { margin: 0; background: var(--boot-bg); }
    #root { min-height: 100vh; }
    .boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; font: 11px/1 ui-monospace, Consolas, monospace; letter-spacing: .14em; color: var(--boot-ink); }
    .boot i { width: 10px; height: 10px; border-radius: 50%; background: var(--boot-teal); box-shadow: 0 0 0 5px color-mix(in srgb, var(--boot-teal) 18%, transparent); animation: boot 1.2s ease-in-out infinite; }
    @keyframes boot { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .boot i { animation: none; } }
  </style>
</head>
<body>
  <div id="root">
    <div class="boot" role="status"><i></i><span>ENOVA PULSE · LOADING</span></div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
